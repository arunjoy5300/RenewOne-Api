
name: .NET 10 API CI/CD

on:
  push:
    branches:
      - PRODUCTION
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-api-deployment
  cancel-in-progress: false

env:
  DOTNET_VERSION: '10.0.x'
  SOLUTION_PATH: './RenewOne-Api.sln'
  API_PROJECT_PATH: './RenewOne-Api/RenewOne-API.csproj'
  PUBLISH_DIR: './publish'
  DEPLOY_DIR: '/var/www/renewone'
  SERVICE_NAME: 'renewone'

jobs:
  build-test-publish:
    name: Build, Test and Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore "$SOLUTION_PATH"

      - name: Build solution
        run: dotnet build "$SOLUTION_PATH" --configuration Release --no-restore

      - name: Run tests
        run: dotnet test "$SOLUTION_PATH" --configuration Release --no-build

      - name: Publish API
        run: dotnet publish "$API_PROJECT_PATH" --configuration Release --no-restore --output "$PUBLISH_DIR"

      - name: Upload published files
        uses: actions/upload-artifact@v4
        with:
          name: published-api
          path: publish/
          if-no-files-found: error
          retention-days: 3

  deploy:
    name: Deploy to Ubuntu VPS
    runs-on: ubuntu-latest
    needs: build-test-publish
    environment: production

    steps:
      - name: Download published files
        uses: actions/download-artifact@v4
        with:
          name: published-api
          path: publish/

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Copy files to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          PORT="${VPS_PORT:-22}"

          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -p $PORT -o StrictHostKeyChecking=yes" \
            publish/ \
            "$VPS_USER@$VPS_HOST:$DEPLOY_DIR/"

      - name: Restart API service
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          PORT="${VPS_PORT:-22}"

          ssh -i ~/.ssh/id_ed25519 \
            -p "$PORT" \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "sudo systemctl restart $SERVICE_NAME &&
             sudo systemctl is-active --quiet $SERVICE_NAME"
