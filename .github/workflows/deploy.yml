
name: RenewOne API CI/CD

on:
  push:
    branches:
      - PRODUCTION
      - cicd-setup
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renewone-production-deployment
  cancel-in-progress: false

env:
  DOTNET_VERSION: '10.0.x'
  SOLUTION_PATH: './RenewOne-Api.slnx'
  API_PROJECT_PATH: './RenewOne.API/RenewOne.API.csproj'
  PUBLISH_DIR: './publish'
  DEPLOY_DIR: '/var/www/renewone'
  SERVICE_NAME: 'renewone'

jobs:
  build-test-publish:
    name: Build, Test and Publish
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore "$SOLUTION_PATH"

      - name: Build solution
        run: dotnet build "$SOLUTION_PATH" --configuration Release --no-restore

      - name: Run tests
        run: dotnet test "$SOLUTION_PATH" --configuration Release --no-build

      - name: Publish API
        run: dotnet publish "$API_PROJECT_PATH" --configuration Release --no-restore --output "$PUBLISH_DIR"

      - name: Upload published artifact
        uses: actions/upload-artifact@v4
        with:
          name: renewone-api
          path: publish/
          if-no-files-found: error
          retention-days: 3

  deploy:
    name: Deploy to Ubuntu VPS
    runs-on: ubuntu-latest
    needs: build-test-publish
    if: github.ref == 'refs/heads/PRODUCTION'
    timeout-minutes: 15
    environment: production

    steps:
      - name: Download published artifact
        uses: actions/download-artifact@v4
        with:
          name: renewone-api
          path: publish/

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -eu
          test -n "$VPS_SSH_KEY"
          test -n "$VPS_KNOWN_HOSTS"

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"

          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Verify SSH connection
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -eu
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          PORT="${VPS_PORT:-22}"

          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -p "$PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "whoami"

      - name: Deploy published files
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -eu
          PORT="${VPS_PORT:-22}"

          rsync -az --delete \
            -e "ssh -i $HOME/.ssh/id_ed25519 -p $PORT -o BatchMode=yes -o StrictHostKeyChecking=yes" \
            publish/ \
            "$VPS_USER@$VPS_HOST:$DEPLOY_DIR/"

      - name: Restart API service
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -eu
          PORT="${VPS_PORT:-22}"

          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -p "$PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "sudo /usr/bin/systemctl restart renewone.service &&
             sudo /usr/bin/systemctl is-active --quiet renewone.service"

      - name: Verify API responds locally
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -eu
          PORT="${VPS_PORT:-22}"

          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -p "$PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "curl --fail --silent --show-error \
             --max-time 10 http://127.0.0.1:5005/health >/dev/null"
